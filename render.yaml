services:
  - type: web
    name: astraforge-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    autoDeployTrigger: checksPass
    envVars:
      - key: ASTRAFORGE_ENVIRONMENT
        value: production
      - key: ASTRAFORGE_LOG_LEVEL
        value: INFO
      - key: ASTRAFORGE_CORS_ORIGINS
        sync: false
      - key: ASTRAFORGE_CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: ASTRAFORGE_DATABASE_URL
        sync: false
      - key: ASTRAFORGE_DATABASE_MIGRATE_ON_STARTUP
        value: "false"
      - key: ASTRAFORGE_RUN_MIGRATIONS_BEFORE_START
        value: "true"
      - key: ASTRAFORGE_MUTATION_AUTH_REQUIRED
        value: "true"
      - key: ASTRAFORGE_MUTATION_API_TOKEN
        generateValue: true
      - key: ASTRAFORGE_EXECUTION_ENABLED
        value: "false"
      - key: ASTRAFORGE_SCANNER_AUTO_START
        value: "true"

  - type: web
    name: astraforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https:; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
