services:
  - type: web
    name: astraforge-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    autoDeployTrigger: checksPass
    envVars:
      - key: ASTRAFORGE_ENVIRONMENT
        value: production
      - key: ASTRAFORGE_LOG_LEVEL
        value: INFO
      - key: ASTRAFORGE_CORS_ORIGINS
        sync: false
      - key: ASTRAFORGE_CORS_ALLOW_CREDENTIALS
        value: "false"
      - key: ASTRAFORGE_DATABASE_URL
        fromDatabase:
          name: astraforge-postgres
          property: connectionString
      - key: ASTRAFORGE_DATABASE_MIGRATE_ON_STARTUP
        value: "false"
      - key: ASTRAFORGE_RUN_MIGRATIONS_BEFORE_START
        value: "true"
      - key: ASTRAFORGE_MUTATION_AUTH_REQUIRED
        value: "false"
      - key: ASTRAFORGE_EXECUTION_ENABLED
        value: "false"
      - key: ASTRAFORGE_SCANNER_AUTO_START
        value: "false"

databases:
  - name: astraforge-postgres
    plan: free
    region: singapore
    databaseName: astraforge
    user: astraforge
    ipAllowList: []
